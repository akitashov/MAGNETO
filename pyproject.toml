[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "magneto"
version = "2026.07.17"
description = "MAGNETO: geomagnetic–SIF observational pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Andrey V. Kitashov"}
]
keywords = ["SIF", "geomagnetic", "photosynthesis", "remote sensing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "xarray>=2024.0",
    "netCDF4>=1.6",
    "pyarrow>=15.0",
    "fastparquet>=2024.0",
    "statsmodels>=0.14",
    "tqdm>=4.60",
    "cartopy>=0.23",
    "cupy-cuda12x>=13.0",
    "pyyaml>=6.0",
    "patsy>=0.5",
    "python-docx>=1.1.0",
    "docxcompose>=2.0.0",
]

[project.scripts]
magneto-run = "scripts.run_pipeline:main"

[tool.setuptools]
py-modules = ["_Common"]

[tool.pytest.ini_options]
markers = ["slow: slow tests that compile all pipeline scripts"]
